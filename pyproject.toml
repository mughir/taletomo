[project]
name = "taletomo"
version = "0.1.0"
description = "TaleTomo — AI Web-Novel Maker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "cryptography>=43.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
