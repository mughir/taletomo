services:
  db:
    image: pgvector/pgvector:pg16
    container_name: taletomo-db
    environment:
      POSTGRES_DB: taletomo
      POSTGRES_USER: taletomo
      POSTGRES_PASSWORD: taletomo_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - taletomo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taletomo -d taletomo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taletomo-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - taletomo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: taletomo-web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8088"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      - DATABASE_URL=postgres://taletomo:taletomo_password@db:5432/taletomo
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=taletomo-dev-secret-key-change-in-production-1234567890
      - DEBUG=True
      - CELERY_ALWAYS_EAGER=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: taletomo-worker
    command: celery -A config worker -l INFO
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://taletomo:taletomo_password@db:5432/taletomo
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=taletomo-dev-secret-key-change-in-production-1234567890
      - DEBUG=True
      - CELERY_ALWAYS_EAGER=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    container_name: taletomo-beat
    command: celery -A config beat -l INFO
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://taletomo:taletomo_password@db:5432/taletomo
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=taletomo-dev-secret-key-change-in-production-1234567890
      - DEBUG=True
      - CELERY_ALWAYS_EAGER=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  taletomo_pgdata:
  taletomo_redisdata:
